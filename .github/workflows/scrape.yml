name: Scrape diario

# Corre el pipeline de ingesta (scrape → matching → upsert en Supabase →
# snapshot de historial) todos los días. También se puede disparar a mano
# desde la pestaña "Actions" del repo (workflow_dispatch).
on:
  schedule:
    - cron: "0 11 * * *" # 11:00 UTC = 08:00 ART, todos los días
    # Para varias corridas por día, agregá más líneas, ej:
    # - cron: "0 23 * * *"  # 20:00 ART
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # supabase-js necesita WebSocket nativo (Node 22+)
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Scrapear y cargar a Supabase
        run: node scrapers/run.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
